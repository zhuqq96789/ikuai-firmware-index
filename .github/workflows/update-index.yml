name: Update firmware index

on:
  workflow_dispatch:
  schedule:
    # 03:17 Asia/Shanghai (19:17 UTC previous day).
    - cron: '17 19 * * *'

permissions:
  contents: write

concurrency:
  group: update-firmware-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_index.py
          python3 scripts/update_index.py --check
      - name: Commit changed index
        run: |
          if git diff --quiet -- history.txt; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.txt
          git commit -m 'Update firmware history index'
          git push
