name: Update firmware index

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 08:00 Beijing time
    - cron: '0 13 * * *'  # 21:00 Beijing time

permissions:
  contents: write

concurrency:
  group: update-firmware-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate index
        env:
          IKUAI_INDEX_GATEWAY: ${{ secrets.IKUAI_INDEX_GATEWAY }}
        run: |
          python3 scripts/update_index.py
          python3 scripts/update_index.py --check
      - name: Commit changed index
        run: |
          git add -- data/catalog.json devices version_list.txt version_enterprise_list.txt version_4_list.txt version_4_enterprise_list.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update firmware history index'
          git push
