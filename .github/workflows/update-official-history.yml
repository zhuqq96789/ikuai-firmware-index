name: Update official release history

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # 08:30 Beijing time

permissions:
  contents: write

concurrency:
  group: update-firmware-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Append and validate official history
        run: |
          python3 scripts/update_official_history.py
          python3 scripts/update_official_history.py --check
      - name: Commit new entries
        run: |
          git add -- official-history.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Append official firmware history'
          git push
